repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 25.12.0
    hooks:
      - id: black
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.20.2
    hooks:
      - id: mypy
        pass_filenames: false
        args:
          - app
          - api
          - config
          - context
          - features
          - media
          - models
          - ocr
          - orchestration
          - pipeline
          - personalization
          - priority
          - reasoning
          - repositories
          - retrieval
          - router
          - speech
          - utils
          - validation
        additional_dependencies:
          - pydantic>=2.8,<3
          - pydantic-settings>=2.4,<3
          - polars>=1.0,<2
          - structlog>=24.4,<26
          - typer>=0.12,<1
