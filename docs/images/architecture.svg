<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520"><style>text{font-family:Arial,sans-serif;fill:#17324d}.t{font-size:30px;font-weight:bold}.c{font-size:16px;fill:#49647a}.b{fill:#e8f1f7;stroke:#27627e;stroke-width:2}.a{font-size:19px;font-weight:bold}</style><rect width="1200" height="520" fill="#f8fbfd"/><text x="55" y="58" class="t">Cortex Notify — Overall Architecture</text><text x="55" y="88" class="c">Deterministic evidence assembly precedes one constrained reasoning boundary.</text><rect x="55" y="145" width="220" height="100" rx="16" class="b"/><text x="85" y="190" class="a">Dataset Layer</text><text x="85" y="218" class="c">Polars CSV adapters</text><rect x="330" y="145" width="220" height="100" rx="16" class="b"/><text x="362" y="190" class="a">Deterministic Core</text><text x="362" y="218" class="c">Context · profile · retrieval</text><rect x="605" y="145" width="220" height="100" rx="16" class="b"/><text x="635" y="190" class="a">DecisionPacket</text><text x="635" y="218" class="c">Features · signals · trace</text><rect x="880" y="145" width="220" height="100" rx="16" class="b"/><text x="933" y="190" class="a">Router</text><text x="933" y="218" class="c">notify · digest · mute</text><path d="M275 195h55m220 0h55m220 0h55" stroke="#27627e" stroke-width="4" marker-end="url(#m)"/><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 9 3 0 6z" fill="#27627e"/></marker></defs><text x="55" y="360" class="a">Cross-cutting guarantees</text><text x="55" y="397" class="c">Typed contracts  •  immutable outputs  •  structured logs  •  versioned algorithms  •  strict output validation</text><text x="55" y="470" class="c">Caption: The architecture freezes data access, deterministic transformation, and reasoning into auditable boundaries.</text></svg>
