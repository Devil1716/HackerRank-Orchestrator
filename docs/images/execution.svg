<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420"><style>text{font-family:Arial;fill:#17324d}.t{font-size:28px;font-weight:bold}.c{font-size:16px;fill:#49647a}.b{fill:#e8f1f7;stroke:#27627e;stroke-width:2}.a{font-size:18px;font-weight:bold}</style><rect width="1000" height="420" fill="#f8fbfd"/><text x="45" y="55" class="t">Runtime Execution</text><text x="45" y="84" class="c">CLI startup creates one explicit dependency container for the invocation.</text><rect x="70" y="145" width="220" height="100" rx="15" class="b"/><text x="112" y="190" class="a">CLI command</text><text x="108" y="218" class="c">run / evaluate / health</text><rect x="390" y="145" width="220" height="100" rx="15" class="b"/><text x="433" y="190" class="a">Container</text><text x="425" y="218" class="c">settings + services</text><rect x="710" y="145" width="220" height="100" rx="15" class="b"/><text x="746" y="190" class="a">Output writer</text><text x="760" y="218" class="c">validated CSV</text><path d="M290 195h100m220 0h100" stroke="#27627e" stroke-width="4"/><text x="45" y="360" class="c">Caption: Startup state is explicit, scoped, and observable; no singleton globals are required.</text></svg>
