<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400"><style>text{font-family:Arial;fill:#17324d}.t{font-size:28px;font-weight:bold}.c{font-size:16px;fill:#49647a}.b{fill:#e8f1f7;stroke:#27627e;stroke-width:2}.a{font-size:18px;font-weight:bold}</style><rect width="900" height="400" fill="#f8fbfd"/><text x="42" y="52" class="t">DecisionPacket Lifecycle</text><text x="42" y="80" class="c">One immutable packet carries all deterministic state and provenance.</text><rect x="55" y="130" width="190" height="100" rx="15" class="b"/><text x="88" y="175" class="a">Five inputs</text><text x="72" y="203" class="c">context through signals</text><rect x="355" y="130" width="190" height="100" rx="15" class="b"/><text x="386" y="175" class="a">Metadata</text><text x="383" y="203" class="c">trace + versions</text><rect x="655" y="130" width="190" height="100" rx="15" class="b"/><text x="685" y="175" class="a">Packet</text><text x="685" y="203" class="c">frozen boundary</text><path d="M245 180h110m190 0h110" stroke="#27627e" stroke-width="4"/><text x="42" y="345" class="c">Caption: Immutability prevents post-validation drift before reasoning.</text></svg>
