<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440"><style>text{font-family:Arial;fill:#17324d}.t{font-size:28px;font-weight:bold}.c{font-size:16px;fill:#49647a}.b{fill:#e8f1f7;stroke:#27627e;stroke-width:2}.a{font-size:19px;font-weight:bold}</style><rect width="1000" height="440" fill="#f8fbfd"/><text x="45" y="54" class="t">Repository Boundaries</text><text x="45" y="82" class="c">One typed, read-only adapter per configured dataset.</text><rect x="55" y="135" width="270" height="150" rx="16" class="b"/><text x="85" y="175" class="a">CSV adapter</text><text x="85" y="208" class="c">scan_csv · schema check</text><text x="85" y="235" class="c">primary-key index · cache</text><rect x="365" y="135" width="270" height="150" rx="16" class="b"/><text x="395" y="175" class="a">Repositories</text><text x="395" y="208" class="c">get · exists · list</text><text x="395" y="235" class="c">typed domain models</text><rect x="675" y="135" width="270" height="150" rx="16" class="b"/><text x="705" y="175" class="a">Services</text><text x="705" y="208" class="c">context and pipeline</text><text x="705" y="235" class="c">never sees Polars</text><path d="M325 210h40m270 0h40" stroke="#27627e" stroke-width="4"/><text x="45" y="370" class="c">Caption: Repository isolation prevents raw tabular state from leaking into decision logic.</text></svg>
