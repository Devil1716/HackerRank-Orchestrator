<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400"><style>text{font-family:Arial;fill:#17324d}.t{font-size:28px;font-weight:bold}.c{font-size:16px;fill:#49647a}.b{fill:#e8f1f7;stroke:#27627e;stroke-width:2}.a{font-size:18px;font-weight:bold}</style><rect width="900" height="400" fill="#f8fbfd"/><text x="42" y="52" class="t">Personalization Layer</text><text x="42" y="80" class="c">Historical behavior becomes bounded preferences and relationship descriptors.</text><rect x="55" y="130" width="190" height="100" rx="15" class="b"/><text x="93" y="175" class="a">Context</text><text x="80" y="203" class="c">history + recipient</text><rect x="355" y="130" width="190" height="100" rx="15" class="b"/><text x="382" y="175" class="a">Extractors</text><text x="390" y="203" class="c">preferences + topics</text><rect x="655" y="130" width="190" height="100" rx="15" class="b"/><text x="674" y="175" class="a">Profile</text><text x="683" y="203" class="c">immutable evidence</text><path d="M245 180h110m190 0h110" stroke="#27627e" stroke-width="4"/><text x="42" y="345" class="c">Caption: Personalization is evidence-backed context, not an autonomous policy engine.</text></svg>
