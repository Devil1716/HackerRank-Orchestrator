<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400"><style>text{font-family:Arial;fill:#17324d}.t{font-size:28px;font-weight:bold}.c{font-size:16px;fill:#49647a}.b{fill:#e8f1f7;stroke:#27627e;stroke-width:2}.a{font-size:18px;font-weight:bold}</style><rect width="1000" height="400" fill="#f8fbfd"/><text x="42" y="52" class="t">Stage Sequence</text><text x="42" y="80" class="c">The lifecycle is ordered from source access to validated output.</text><path d="M110 145v120M300 145v120M490 145v120M680 145v120M870 145v120" stroke="#27627e" stroke-width="2"/><g class="b"><rect x="45" y="125" width="130" height="42" rx="10"/><rect x="235" y="125" width="130" height="42" rx="10"/><rect x="425" y="125" width="130" height="42" rx="10"/><rect x="615" y="125" width="130" height="42" rx="10"/><rect x="805" y="125" width="130" height="42" rx="10"/></g><g class="a"><text x="77" y="153">CLI</text><text x="259" y="153">Build</text><text x="451" y="153">Reason</text><text x="636" y="153">Validate</text><text x="833" y="153">Export</text></g><text x="42" y="345" class="c">Caption: The execution trace records this sequence for each constructed packet.</text></svg>
