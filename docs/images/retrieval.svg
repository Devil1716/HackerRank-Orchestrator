<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400"><style>text{font-family:Arial;fill:#17324d}.t{font-size:28px;font-weight:bold}.c{font-size:16px;fill:#49647a}.b{fill:#e8f1f7;stroke:#27627e;stroke-width:2}.a{font-size:18px;font-weight:bold}</style><rect width="900" height="400" fill="#f8fbfd"/><text x="42" y="52" class="t">Evidence Retrieval</text><text x="42" y="80" class="c">Multiple deterministic retrievers produce a ranked, traceable evidence bundle.</text><rect x="55" y="130" width="190" height="100" rx="15" class="b"/><text x="101" y="175" class="a">Inputs</text><text x="76" y="203" class="c">context + profile</text><rect x="355" y="130" width="190" height="100" rx="15" class="b"/><text x="393" y="175" class="a">Retrievers</text><text x="381" y="203" class="c">history + topic</text><rect x="655" y="130" width="190" height="100" rx="15" class="b"/><text x="677" y="175" class="a">EvidenceBundle</text><text x="696" y="203" class="c">ranked + scored</text><path d="M245 180h110m190 0h110" stroke="#27627e" stroke-width="4"/><text x="42" y="345" class="c">Caption: Evidence remains source-linked so explanations can be audited.</text></svg>
