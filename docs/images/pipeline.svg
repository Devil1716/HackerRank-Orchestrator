<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440"><style>text{font-family:Arial;fill:#17324d}.t{font-size:28px;font-weight:bold}.c{font-size:16px;fill:#49647a}.b{fill:#e8f1f7;stroke:#27627e;stroke-width:2}.a{font-size:17px;font-weight:bold}</style><rect width="1200" height="440" fill="#f8fbfd"/><text x="45" y="54" class="t">Deterministic Notification Pipeline</text><text x="45" y="82" class="c">The fixed order makes every decision reproducible and inspectable.</text><g class="b"><rect x="45" y="145" width="125" height="90" rx="14"/><rect x="195" y="145" width="125" height="90" rx="14"/><rect x="345" y="145" width="125" height="90" rx="14"/><rect x="495" y="145" width="125" height="90" rx="14"/><rect x="645" y="145" width="125" height="90" rx="14"/><rect x="795" y="145" width="125" height="90" rx="14"/><rect x="945" y="145" width="125" height="90" rx="14"/></g><g class="a"><text x="67" y="195">Context</text><text x="211" y="195">Profile</text><text x="366" y="195">Evidence</text><text x="515" y="195">Features</text><text x="665" y="195">Signals</text><text x="813" y="195">Packet</text><text x="970" y="195">Router</text></g><path d="M170 190h25m125 0h25m125 0h25m125 0h25m125 0h25m125 0h25" stroke="#27627e" stroke-width="4"/><text x="45" y="350" class="c">Caption: Every stage consumes typed immutable results and emits the next deterministic contract.</text></svg>
