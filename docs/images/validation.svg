<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400"><style>text{font-family:Arial;fill:#17324d}.t{font-size:28px;font-weight:bold}.c{font-size:16px;fill:#49647a}.b{fill:#e8f1f7;stroke:#27627e;stroke-width:2}.a{font-size:18px;font-weight:bold}</style><rect width="900" height="400" fill="#f8fbfd"/><text x="42" y="52" class="t">Validation and Repair</text><text x="42" y="80" class="c">Strict schema checks protect the submission boundary from malformed reasoning output.</text><rect x="55" y="130" width="190" height="100" rx="15" class="b"/><text x="100" y="175" class="a">Raw output</text><text x="82" y="203" class="c">provider response</text><rect x="355" y="130" width="190" height="100" rx="15" class="b"/><text x="390" y="175" class="a">Validator</text><text x="381" y="203" class="c">schema + evidence</text><rect x="655" y="130" width="190" height="100" rx="15" class="b"/><text x="698" y="175" class="a">CSV row</text><text x="684" y="203" class="c">safe fallback if needed</text><path d="M245 180h110m190 0h110" stroke="#27627e" stroke-width="4"/><text x="42" y="345" class="c">Caption: Invalid output cannot bypass the final typed validation boundary.</text></svg>
