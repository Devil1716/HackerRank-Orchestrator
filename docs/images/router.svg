<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400"><style>text{font-family:Arial;fill:#17324d}.t{font-size:28px;font-weight:bold}.c{font-size:16px;fill:#49647a}.b{fill:#e8f1f7;stroke:#27627e;stroke-width:2}.a{font-size:18px;font-weight:bold}</style><rect width="900" height="400" fill="#f8fbfd"/><text x="42" y="52" class="t">Router Flow</text><text x="42" y="80" class="c">A single provider boundary maps the packet to a constrained action.</text><rect x="55" y="130" width="190" height="100" rx="15" class="b"/><text x="91" y="175" class="a">DecisionPacket</text><text x="90" y="203" class="c">typed, complete</text><rect x="355" y="130" width="190" height="100" rx="15" class="b"/><text x="405" y="175" class="a">Reasoner</text><text x="384" y="203" class="c">Mock baseline</text><rect x="655" y="130" width="190" height="100" rx="15" class="b"/><text x="708" y="175" class="a">Decision</text><text x="684" y="203" class="c">validated action</text><path d="M245 180h110m190 0h110" stroke="#27627e" stroke-width="4"/><text x="42" y="345" class="c">Caption: The Router Agent is downstream of deterministic preparation and cannot access raw data.</text></svg>
