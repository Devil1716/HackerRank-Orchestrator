<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400"><style>text{font-family:Arial;fill:#17324d}.t{font-size:28px;font-weight:bold}.c{font-size:16px;fill:#49647a}.b{fill:#e8f1f7;stroke:#27627e;stroke-width:2}.a{font-size:18px;font-weight:bold}</style><rect width="900" height="400" fill="#f8fbfd"/><text x="42" y="52" class="t">Context Construction</text><text x="42" y="80" class="c">A message is enriched with only deterministic, available context.</text><rect x="55" y="130" width="190" height="100" rx="15" class="b"/><text x="99" y="175" class="a">Message</text><text x="83" y="203" class="c">identity + content</text><rect x="355" y="130" width="190" height="100" rx="15" class="b"/><text x="405" y="175" class="a">Participants</text><text x="381" y="203" class="c">users + conversation</text><rect x="655" y="130" width="190" height="100" rx="15" class="b"/><text x="688" y="175" class="a">MessageContext</text><text x="705" y="203" class="c">typed snapshot</text><path d="M245 180h110m190 0h110" stroke="#27627e" stroke-width="4"/><text x="42" y="345" class="c">Caption: Context is the stable input snapshot shared by later stages.</text></svg>
