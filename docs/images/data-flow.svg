<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420"><style>text{font-family:Arial;fill:#17324d}.t{font-size:28px;font-weight:bold}.c{font-size:16px;fill:#49647a}.b{fill:#e8f1f7;stroke:#27627e;stroke-width:2}.a{font-size:18px;font-weight:bold}</style><rect width="1000" height="420" fill="#f8fbfd"/><text x="42" y="52" class="t">Data Flow and Provenance</text><text x="42" y="80" class="c">Every transformation preserves source identity and algorithm metadata.</text><rect x="55" y="135" width="200" height="100" rx="15" class="b"/><text x="112" y="178" class="a">CSV row</text><text x="85" y="207" class="c">source identity</text><rect x="365" y="135" width="200" height="100" rx="15" class="b"/><text x="411" y="178" class="a">Domain model</text><text x="399" y="207" class="c">typed snapshot</text><rect x="675" y="135" width="250" height="100" rx="15" class="b"/><text x="716" y="178" class="a">Decision metadata</text><text x="711" y="207" class="c">trace + evidence + version</text><path d="M255 185h110m200 0h110" stroke="#27627e" stroke-width="4"/><text x="42" y="365" class="c">Caption: Provenance is carried forward rather than reconstructed after routing.</text></svg>
