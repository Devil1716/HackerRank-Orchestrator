<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400"><style>text{font-family:Arial;fill:#17324d}.t{font-size:28px;font-weight:bold}.c{font-size:16px;fill:#49647a}.b{fill:#e8f1f7;stroke:#27627e;stroke-width:2}.a{font-size:18px;font-weight:bold}</style><rect width="900" height="400" fill="#f8fbfd"/><text x="42" y="52" class="t">Feature Engineering</text><text x="42" y="80" class="c">Twenty-five deterministic measures are calculated in a stable feature contract.</text><rect x="55" y="130" width="190" height="100" rx="15" class="b"/><text x="99" y="175" class="a">Three inputs</text><text x="74" y="203" class="c">context + profile + evidence</text><rect x="355" y="130" width="190" height="100" rx="15" class="b"/><text x="397" y="175" class="a">25 features</text><text x="385" y="203" class="c">scores + confidence</text><rect x="655" y="130" width="190" height="100" rx="15" class="b"/><text x="687" y="175" class="a">Versioned output</text><text x="705" y="203" class="c">phase6-v1</text><path d="M245 180h110m190 0h110" stroke="#27627e" stroke-width="4"/><text x="42" y="345" class="c">Caption: Features are explicit, testable inputs to signal aggregation.</text></svg>
